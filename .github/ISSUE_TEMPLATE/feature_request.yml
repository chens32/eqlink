name: Feature request
description: Propose a focused improvement to EqLink.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the need without private network identifiers or credentials.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
