name: CI

on:
  # CI is paused in repository settings. Re-enable explicitly when ready.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Source hygiene and offline deployment checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check publication boundaries
        run: python tools/check-repository.py --tracked-only
      - name: Scan Git history with checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci/gitleaks
          cd artifacts/ci/gitleaks
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          artifacts/ci/gitleaks/gitleaks git . --redact=100 --no-banner --no-color --log-opts='--all'
      - name: Install schema validator
        run: python -m pip install -r .github/requirements-ci.txt
      - name: Compile Python tools and check offline upgrade preservation
        run: |
          python -m compileall -q packaging tools
          python packaging/k3s/test-upgrade.py
      - name: Validate generated Kubernetes resources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          target = Path('artifacts/k3s/schema')
          target.mkdir(parents=True, exist_ok=True)
          base = 'https://raw.githubusercontent.com/kubernetes/kubernetes/v1.34.1/api/openapi-spec/v3/'
          for name in ('api__v1_openapi.json', 'apis__apps__v1_openapi.json'):
              (target / name).write_bytes(urlopen(base + name, timeout=60).read())
          PY
          python packaging/k3s/test-manifests.py --schema-dir artifacts/k3s/schema

  core:
    name: Core and server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build Linux server source and cross-platform tools
        run: |
          dotnet build src/EqLink.Server/EqLink.Server.csproj -c Release
          dotnet build src/EqLink.PeerProbe/EqLink.PeerProbe.csproj -c Release
      - name: Run isolated core tests
        run: dotnet run --project src/EqLink.Tests/EqLink.Tests.csproj -c Release

  windows:
    name: Windows client compilation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build client and isolated test projects
        run: |
          dotnet build src/EqLink.ClientGui/EqLink.ClientGui.csproj -c Release
          dotnet build src/EqLink.ClientService/EqLink.ClientService.csproj -c Release
          dotnet build src/EqLink.GuiTests/EqLink.GuiTests.csproj -c Release
          dotnet build src/EqLink.WindowsTests/EqLink.WindowsTests.csproj -c Release
